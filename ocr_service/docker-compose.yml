services:

  ocr:

    build:
      context: .

    image: vitrage-ocr:latest

    container_name: vitrage-ocr

    restart: unless-stopped

    ports:
      - "8080:8080"

    volumes:
      - ./app:/app/app

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s